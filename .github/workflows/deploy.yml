name: Deploy to GitHub Pages

# Only code changes are published. Live data (stations, warnings, hydro, Kp, marine)
# comes from the Cloudflare workers, so there is no schedule here.
on:
  push:
    branches: [main]
    # Worker code, workflows, docs and tests are not part of the published site
    # (a workflow change can still be published by hand with "Run workflow")
    paths-ignore:
      - '.github/**'
      - 'cloudflare-worker/**'
      - 'docs/**'
      - 'test/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A commit that fails the unit tests is not published (they take a second)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test test/*.test.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
